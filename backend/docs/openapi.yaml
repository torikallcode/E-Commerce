openapi: 3.0.3
info:
  title: E-Commerce API
  version: 1.0.0
  description: API for e-commerce platform built with Go + Gin + GORM
  contact:
    name: E-Commerce Team
    email: admin@example.com

servers:
  - url: http://localhost:8080/api/v1
    description: Development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
            user:
              $ref: "#/components/schemas/UserResponse"
        User:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            email:
              type: string
            role:
              type: string
            created_at:
              type: string
              format: date-time
    UserResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
        created_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        error:
          type: string
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
    OrderNumberResponse:
      type: object
      properties:
        order_number:
          type: string
    PaymentStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            order_number:
              type: string
            status:
              type: string
            payment_type:
              type: string
            transaction_id:
              type: string
            gross_amount:
              type: number
              format: decimal
    OrderListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/OrderSummary"
        meta:
          type: object
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
    OrderSummary:
      type: object
      properties:
        id:
          type: integer
        order_number:
          type: string
        status:
          type: string
        total_amount:
          type: number
          format: decimal
        created_at:
          type: string
          format: date-time
    PaymentNotificationRequest:
      type: object
      required:
        - order_id
        - status_code
        - gross_amount
        - signature_key
      properties:
        order_id:
          type: string
        status_code:
          type: integer
        gross_amount:
          type: number
          format: decimal
        signature_key:
          type: string
    CategoryResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
    ProductResponse:
      type: object
      properties:
        id:
          type: integer
        category_id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        price:
          type: number
          format: decimal
        stock:
          type: integer
        is_active:
          type: boolean
        images:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              sort_order:
                type: integer
        created_at:
          type: string
          format: date-time
    OrderItemResponse:
      type: object
      properties:
        id:
          type: integer
        product_name:
          type: string
        price:
          type: number
          format: decimal
        quantity:
          type: integer
        subtotal:
          type: number
          format: decimal

paths:
  /auth/register:
    post:
      summary: Register a new user
      operationId: Register
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already registered
  /auth/login:
    post:
      summary: Login user
      operationId: Login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
  /auth/refresh:
    post:
      summary: Refresh access token
      operationId: Refresh
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid or expired refresh token
  /auth/logout:
    post:
      summary: Logout user
      operationId: Logout
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout successful
        "401":
          description: Invalid or expired token
  /me:
    get:
      summary: Get current user profile
      operationId: GetProfile
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Invalid or expired token
  /me:
    put:
      summary: Update user profile
      operationId: UpdateProfile
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input or email conflict
  /addresses:
    get:
      summary: Get user addresses
      operationId: ListAddresses
      tags:
        - Address
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of addresses
  /addresses:
    post:
      summary: Create new address
      operationId: CreateAddress
      tags:
        - Address
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient_name:
                  type: string
                phone:
                  type: string
                address_line:
                  type: string
                city:
                  type: string
                province:
                  type: string
                postal_code:
                  type: string
      responses:
        "201":
          description: Address created
  /addresses/:id:
    put:
      summary: Update address
      operationId: UpdateAddress
      tags:
        - Address
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient_name:
                  type: string
                phone:
                  type: string
                address_line:
                  type: string
                city:
                  type: string
                province:
                  type: string
                postal_code:
                  type: string
      responses:
        "200":
          description: Address updated
    delete:
      summary: Delete address
      operationId: DeleteAddress
      tags:
        - Address
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Address deleted
  /products:
    get:
      summary: List products
      operationId: ListProducts
      tags:
        - Catalog
      parameters:
        - name: q
          in: query
          description: Search by name
          schema:
            type: string
        - name: category
          in: query
          description: Filter by category ID
          schema:
            type: integer
        - name: min_price
          in: query
          description: Minimum price
          schema:
            type: number
            format: decimal
        - name: max_price
          in: query
          description: Maximum price
          schema:
            type: number
            format: decimal
        - name: sort
          in: query
          description: Sort by field
          schema:
            type: string
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: Items per page
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
        "400":
          description: Invalid query parameters
  /products/:slug:
    get:
      summary: Get product detail
      operationId: GetProductDetail
      tags:
        - Catalog
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          description: Product not found
  /categories:
    get:
      summary: List categories
      operationId: ListCategories
      tags:
        - Catalog
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryResponse"
  /cart:
    get:
      summary: Get cart
      operationId: GetCart
      tags:
        - Cart
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cart details
  /cart/items:
    post:
      summary: Add item to cart
      operationId: AddToCart
      tags:
        - Cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product_id:
                  type: integer
                quantity:
                  type: integer
                default: 1
      responses:
        "200":
          description: Item added to cart
  /cart/items/:id:
    put:
      summary: Update cart item quantity
      operationId: UpdateCartItem
      tags:
        - Cart
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
      responses:
        "200":
          description: Cart item updated
    delete:
      summary: Remove cart item
      operationId: RemoveCartItem
      tags:
        - Cart
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Item removed from cart
  /orders:
    post:
      summary: Checkout - create order
      operationId: CreateOrder
      tags:
        - Orders and Payment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address_id:
                  type: integer
      responses:
        "200":
          description: Order created with snap token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNumberResponse"
        "400":
          description: Invalid input or insufficient stock
    get:
      summary: Get user orders
      operationId: ListUserOrders
      tags:
        - Orders and Payment
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of user orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
    /{order_number}:
      get:
        summary: Get order detail
        operationId: GetOrderDetail
        tags:
          - Orders and Payment
        parameters:
          - name: order_number
            in: path
            required: true
            schema:
              type: string
        responses:
          "200":
            description: Order detail
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OrderSummary"
          "404":
            description: Order not found
  /orders/{order_number}/cancel:
    post:
      summary: Cancel order
      operationId: CancelOrder
      tags:
        - Orders and Payment
      security:
        - bearerAuth: []
      parameters:
        - name: order_number
          in: path
          required: true
          schema:
            type: string
        responses:
          "200":
            description: Order cancelled
          "400":
            description: Cannot cancel order
  /orders/{order_number}/payment-status:
    get:
      summary: Get payment status
      operationId: GetPaymentStatus
      tags:
        - Orders and Payment
      security:
        - bearerAuth: []
      parameters:
        - name: order_number
          in: path
          required: true
          schema:
            type: string
        responses:
          "200":
            description: Payment status
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/PaymentStatusResponse"
          "404":
            description: Order not found
  /payments/midtrans/notification:
    post:
      summary: Midtrans webhook notification
      operationId: MidtransNotification
      tags:
        - Payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentNotificationRequest"
      responses:
        "200":
          description: Notification processed
        "401":
          description: Invalid signature
  /admin/products:
    get:
      summary: List admin products
      operationId: ListAdminProducts
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Product list
    post:
      summary: Create product
      operationId: CreateProduct
      tags:
        - Admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                  format: decimal
                category_id:
                  type: integer
                stock:
                  type: integer
      responses:
        "201":
          description: Product created
        "400":
          description: Invalid input
    /{id}:
      put:
        summary: Update product
        operationId: UpdateProduct
        tags:
          - Admin
        security:
          - bearerAuth: []
        parameters:
          - name: id
            in: path
            required: true
            schema:
              type: integer
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  description:
                    type: string
                  price:
                    type: number
                    format: decimal
                  stock:
                    type: integer
        responses:
          "200":
            description: Product updated
          "404":
            description: Product not found
      delete:
        summary: Delete product
        operationId: DeleteProduct
        tags:
          - Admin
        security:
          - bearerAuth: []
        parameters:
          - name: id
            in: path
            required: true
            schema:
              type: integer
        responses:
          "200":
            description: Product deleted
  /admin/products/{id}/images:
    post:
      summary: Upload product image
      operationId: UploadProductImage
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
    delete:
      summary: Delete product image
      operationId: DeleteProductImage
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: image_id
          in: path
          required: true
          schema:
            type: integer
  /admin/categories:
    get:
      summary: List admin categories
      operationId: ListAdminCategories
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Category list
    post:
      summary: Create category
      operationId: CreateCategory
      tags:
        - Admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                parent_id:
                  type: integer
    /{id}:
      put:
        summary: Update category
      delete:
        summary: Delete category
  /admin/orders:
    get:
      summary: List admin orders
      operationId: ListAdminOrders
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Search by order number
          schema:
            type: string
      responses:
        "200":
          description: Order list
  /admin/orders/{id}:
    get:
      summary: Get admin order detail
      operationId: GetAdminOrderDetail
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order detail
  /admin/orders/{id}/status:
    patch:
      summary: Update order status
      operationId: UpdateOrderStatus
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - pending_payment
                    - pending_review
                    - paid
                    - processing
                    - shipped
                    - completed
                    - cancelled
                    - expired
                    - failed
                    - refunded
      responses:
        "200":
          description: Status updated
        "400":
          description: Invalid status transition
  /admin/users:
    get:
      summary: List admin users
      operationId: ListAdminUsers
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User list
  /admin/dashboard/summary:
    get:
      summary: Get dashboard summary
      operationId: DashboardSummary
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard summary
```